plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")

    repositories {
        exclusiveContent { // Sable
            forRepository {
                maven {
                    url = "https://maven.ryanhcode.dev/releases"
                    name = "RyanHCode Maven"
                }
            }
            filter {
                includeGroup("dev.ryanhcode.sable")
                includeGroup("dev.ryanhcode.sable-companion")
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    url "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }

        maven { // For ImGuiMC
            url = "https://maven.ryanhcode.dev/releases"
            name = "RyanHCode Maven"
        }
        maven { // For Veil
            name = 'BlameJared Maven (CrT / Bookshelf)'
            url = 'https://maven.blamejared.com'
        }

        maven {
            name = "Fuzs Mod Resources"
            url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
        }

        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            // forRepositories(fg.repository) // Uncomment when using ForgeGradle
            filter {
                includeGroup "maven.modrinth"
            }
        }

        maven {
            name = 'GeckoLib'
            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            content {
                includeGroup("software.bernie.geckolib")
            }
        }

        mavenLocal()
    }

    base {
        archivesName = mod_id
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    neoForge {
        version = project.neo_version

        parchment {
            mappingsVersion = project.parchment_mappings_version
            minecraftVersion = project.parchment_minecraft_version
        }

        setValidateAccessTransformers(true)

        runs {
            client {
                client()
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            server {
                server()
                programArgument '--nogui'
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            gameTestServer {
                type = "gameTestServer"
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }

            data {
                data()
                programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            }

            clientAuth {
                client()
                devLogin = true
            }

            configureEach {
                systemProperty 'forge.logging.markers', 'REGISTRIES'
                logLevel = org.slf4j.event.Level.WARN
            }
        }

        mods {
            "${mod_id}" {
                sourceSet(sourceSets.main)
            }
        }
    }

    configurations {
        runtimeClasspath.extendsFrom localRuntime
    }

    dependencies {
        api("dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}")
        runtimeOnly ("curse.maven:sable-1312371:8666912")
        jarJar(api("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:[${project.sable_companion_version},)")) {
            version {
                prefer(project.sable_companion_version)
            }
        }

        implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
        compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
        runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
        implementation("com.tterrag.registrate:Registrate:${registrate_version}")

        implementation "curse.maven:explosive-enhancement-reforged-1036246:6520579"
        jarJar(implementation("net.nikdo53.tinymultiblocklib:tiny-multiblock-lib-neoforge-1.21.1:4.0.0"))

        jarJar(implementation("maven.modrinth:fancytabsections:6.1-NEOFORGE-1.21.1"))

        implementation "maven.modrinth:oWaK0Q19:w7zlLnea"
    }

    var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
        var replaceProperties = [
                minecraft_version      : minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version            : neo_version,
                loader_version_range   : loader_version_range,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_license            : mod_license,
                mod_version            : mod_version,
        ]
        inputs.properties replaceProperties
        expand replaceProperties
        from "src/main/templates"
        into "build/generated/sources/modMetadata"
    }
    sourceSets.main.resources.srcDir generateModMetadata
    neoForge.ideSyncTask generateModMetadata

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    idea {
        module {
            downloadSources = true
            downloadJavadoc = true
        }
    }
}
